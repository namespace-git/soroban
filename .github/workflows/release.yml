name: release

# タグ v* を push すると、mac / Windows をビルドし、最後に 1 つの GitHub Release にまとめて公開する。
# electron-builder の publish は使わない（mac と Windows のジョブが別々に Release を作ってしまうため）。
# アプリは electron-updater でこの Releases（latest.yml / latest-mac.yml）を見て更新を知らせる（src/main/updater.ts）。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    # macos-15（Sequoia）ランナーでは dmg 作成時の hdiutil detach が Resource busy で失敗する
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: stop Spotlight indexing (hdiutil detach が Resource busy になるのを防ぐ)
        run: sudo mdutil -a -i off || true
      - name: build (mac, unsigned)
        run: pnpm dist:mac:ci
        env:
          # 配布用の署名（Apple Developer Program）は付けていない（README の「初回起動」参照）
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # publish しなくても、latest-mac.yml を作るために publish 設定の初期化でトークンが要る
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            release/*.dmg
            release/*.dmg.blockmap
            release/latest-mac.yml
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: build (windows)
        run: pnpm dist:win:ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

  publish:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          # ダウンロードする場所に入れ方を書いておく。アプリ内のヘルプにも同じことを
          # 書いてあるが、macOS で開けないときは「そのアプリが開けない」ので読めない
          body: |
            ## 入れ方

            **Windows** … `soroban-setup-*.exe` を実行。「WindowsによってPCが保護されました」が出たら「詳細情報」→「実行」。

            **macOS** … チップに合う方を選ぶ（アップルマーク →「この Mac について」→「チップ」）。
            `Apple M…` なら `-arm64.dmg`、`Intel` なら `-x64.dmg`。**選び間違えると開きません。**

            dmg を開いてアプリケーションへドラッグした後、**「"そろばん"は壊れているため開けません」**と出たら、
            ターミナル（アプリケーション → ユーティリティ）で次を実行してください。

            ```
            xattr -dr com.apple.quarantine /Applications/Soroban.app
            ```

            成功すると**何も表示されません**。`sudo` は要りません。
            （署名が無いアプリに macOS が付ける印を外しているだけで、壊れてはいません）

            帳簿のデータは消えません。念のため入れ替える前に 設定 → データ でバックアップを取ってください。

            ---
          files: dist/*
